<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Estrela luminosa do Lumen</title>
  <desc id="desc">Um ponto de luz se abre em uma estrela dourada; duas pequenas estrelas orbitam e se acomodam. A animação dura 0,8 segundo.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17171d"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#fff8e7" stop-opacity=".95"/><stop offset=".2" stop-color="#ffca68" stop-opacity=".7"/><stop offset="1" stop-color="#efa83f" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1=".16" y1=".18" x2=".84" y2=".82"><stop stop-color="#fff8e7"/><stop offset=".52" stop-color="#ffda8b"/><stop offset="1" stop-color="#e9a33e"/></linearGradient>
    <path id="mini" d="M0-24 C4-8 8-4 24 0 C8 4 4 8 0 24 C-4 8-8 4-24 0 C-8-4-4-8 0-24Z"/>
    <style>
      @keyframes main-star { 0%,14% { opacity:0; transform:scale(.02) rotate(-45deg) } 23% { opacity:1; transform:scale(.16) rotate(-45deg) } 65% { opacity:1; transform:scale(1.04) rotate(-18deg) } 86% { opacity:1; transform:scale(.985) rotate(-2deg) } 100% { opacity:1; transform:scale(1) rotate(0deg) } }
      @keyframes orbit { 0%,40% { opacity:0; transform:rotate(0deg) scale(.12) } 60% { opacity:.85; transform:rotate(25deg) scale(.62) } 91%,100% { opacity:1; transform:rotate(45deg) scale(1) } }
      @keyframes rings { 0%,12% { opacity:0; transform:scale(.72) } 65%,100% { opacity:.24; transform:scale(1) } }
      @keyframes core { 0%,20% { opacity:0 } 60% { opacity:.92 } 100% { opacity:.42 } }
      .main { opacity:0; transform-box:fill-box; transform-origin:center; animation:main-star 800ms cubic-bezier(.16,1,.3,1) 1 both }
      .pair { opacity:0; transform-box:fill-box; transform-origin:center; animation:orbit 800ms cubic-bezier(.16,1,.3,1) 1 both }
      .rings { opacity:0; transform-box:fill-box; transform-origin:center; animation:rings 800ms ease-out 1 both }
      .core { opacity:0; animation:core 800ms ease-out 1 both }
      @media (prefers-reduced-motion: reduce) {
        .main { opacity:1; transform:none; animation:none }
        .pair { opacity:1; transform:rotate(45deg) scale(1); animation:none }
        .rings { opacity:.24; transform:none; animation:none }
        .core { opacity:.42; animation:none }
      }
    </style>
  </defs>
  <rect width="512" height="512" fill="#08090b"/>
  <rect x="22" y="22" width="468" height="468" rx="82" fill="url(#tile)" stroke="#332f35" stroke-width="2"/>
  <g class="rings" fill="none" stroke="#c69a58" stroke-width="1.2"><circle cx="256" cy="256" r="128" opacity=".7"/><circle cx="256" cy="256" r="164" opacity=".55"/></g>
  <circle class="core" cx="256" cy="256" r="138" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="3.5" fill="#fff2d1" opacity=".9"/>
  <g transform="translate(256 256)"><path class="main" d="M0-150 C25-55 55-25 150 0 C55 25 25 55 0 150 C-25 55-55 25-150 0 C-55-25-25-55 0-150Z" fill="url(#gold)"/></g>
  <g transform="translate(256 256)"><g class="pair" fill="#ffd27b"><use href="#mini" transform="translate(0 -80) scale(.68)"/><use href="#mini" transform="translate(0 80) scale(.68)"/></g></g>
</svg>
