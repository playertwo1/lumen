<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cristal luminoso do Lumen</title>
  <desc id="desc">Facetas violetas se encaixam para formar um cristal. O núcleo dourado acende, brilha brevemente e se estabiliza. A animação dura 0,8 segundo.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17131f"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="violetLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a877ff"/><stop offset="1" stop-color="#5424aa"/></linearGradient>
    <linearGradient id="core" x1=".15" y1=".1" x2=".9" y2=".9"><stop stop-color="#fff1c9"/><stop offset=".55" stop-color="#f3b65c"/><stop offset="1" stop-color="#d47ede"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffe9ae" stop-opacity=".95"/><stop offset=".25" stop-color="#eab35c" stop-opacity=".5"/><stop offset="1" stop-color="#9e63ff" stop-opacity="0"/></radialGradient>
    <style>
      @keyframes from-left { 0%,12% {opacity:0;transform:translate(-145px,0)} 20% {opacity:1} 58%,100% {opacity:1;transform:translate(0,0)} }
      @keyframes from-right { 0%,18% {opacity:0;transform:translate(145px,0)} 25% {opacity:1} 66%,100% {opacity:1;transform:translate(0,0)} }
      @keyframes from-top { 0%,8% {opacity:0;transform:translate(0,-140px)} 15% {opacity:1} 55%,100% {opacity:1;transform:translate(0,0)} }
      @keyframes from-bottom { 0%,22% {opacity:0;transform:translate(0,140px)} 29% {opacity:1} 72%,100% {opacity:1;transform:translate(0,0)} }
      @keyframes outline { 0%,52% {opacity:0} 74%,100% {opacity:.55} }
      @keyframes core-glow { 0%,46% {opacity:0;transform:scale(.25)} 58% {opacity:.2;transform:scale(.55)} 72% {opacity:.95;transform:scale(1.28)} 84% {opacity:.5;transform:scale(.96)} 100% {opacity:.42;transform:scale(1)} }
      @keyframes core-light { 0%,46% {opacity:0;transform:scale(.45)} 58% {opacity:.45;transform:scale(.78)} 72% {opacity:1;transform:scale(1.08)} 84%,100% {opacity:1;transform:scale(1)} }
      .facet { transform-box:fill-box; transform-origin:center; animation-duration:800ms; animation-timing-function:cubic-bezier(.16,1,.3,1); animation-iteration-count:1; animation-fill-mode:both }
      .left { animation-name:from-left }
      .right { animation-name:from-right }
      .top { animation-name:from-top }
      .bottom { animation-name:from-bottom }
      .outline { opacity:0; animation:outline 800ms ease-out 1 both }
      .core-glow,.core-light { transform-box:fill-box; transform-origin:center; animation-duration:800ms; animation-timing-function:ease-out; animation-iteration-count:1; animation-fill-mode:both }
      .core-glow { opacity:0; animation-name:core-glow }
      .core-light { opacity:0; animation-name:core-light }
      @media (prefers-reduced-motion: reduce) {
        .facet { opacity:1; transform:none; animation:none }
        .outline { opacity:.55; animation:none }
        .core-glow { opacity:.42; transform:none; animation:none }
        .core-light { opacity:1; transform:none; animation:none }
      }
    </style>
  </defs>
  <rect width="512" height="512" fill="#08090b"/>
  <rect x="22" y="22" width="468" height="468" rx="82" fill="url(#tile)" stroke="#332f35" stroke-width="2"/>
  <circle class="core-glow" cx="256" cy="256" r="128" fill="url(#glow)"/>
  <path class="facet top" fill="#201a37" d="M256 110 190 150 226 270 256 236Z"/>
  <path class="facet top" fill="url(#violetLight)" d="M256 110 322 150 290 236 256 198Z"/>
  <path class="facet left" fill="#35215f" d="M190 150 150 271 226 330 256 236 226 270Z"/>
  <path class="facet right" fill="#5429a9" d="M322 150 362 271 304 330 290 236 256 198Z"/>
  <path class="facet bottom" fill="#38256d" d="M226 270 256 236 256 404 225 404 176 330Z"/>
  <path class="facet bottom" fill="#211a3e" d="M256 236 304 330 287 404 256 404Z"/>
  <path class="outline" fill="none" stroke="#a68aca" stroke-width="2" stroke-linejoin="round" d="M256 110 322 150 362 271 304 330 287 404 225 404 176 330 150 271 190 150Z"/>
  <path class="core-light" d="M256 204 300 256 256 316 212 256Z" fill="url(#core)"/>
</svg>
